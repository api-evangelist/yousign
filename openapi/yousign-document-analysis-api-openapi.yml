          description: Vehicle license plate number extracted from the document.
          nullable: true
          type: string
        vehicle_identification_number:
          description: Vehicle identification number (VIN) extracted from the document.
          nullable: true
          type: string
        vehicle_purpose:
          description: Vehicle purpose extracted from the document.
          nullable: true
          type: string
        vehicle_first_registration_year:
          description: Year of the vehicle's first registration extracted from the document.
          nullable: true
          type: string
        vehicle_owner_information:
