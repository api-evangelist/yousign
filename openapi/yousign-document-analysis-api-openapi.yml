      - document_reason
      - document_recipient_information
      - issuance_date
      - other_details
      - vehicle_category
      - vehicle_first_registration_year
      - vehicle_identification_number
      - vehicle_license_number
      - vehicle_owner_information
      - vehicle_purpose
      title: Temporary Vehicle Registration Document Extraction
      type: object
    FraudRiskAnalysis_indicators_inner:
      additionalProperties: false
      properties:
        indicator:
          description: Machine-readable identifier of the detected indicator.
          example: document_metadata_modified
          type: string
        type:
          description: Type of the indicator.
          example: metadata
          type: string
        category:
          description: Category the indicator belongs to.
          example: tampering
          type: string
        title:
          description: Human-readable title of the indicator.
          example: Document metadata has been modified
          type: string
        description:
          description: Human-readable description of the indicator.
          example: The document metadata shows signs of modification by an editing tool.
          type: string
      required:
      - category
      - description
      - indicator
      - title
      - type
      type: object
