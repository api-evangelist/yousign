          nullable: true
          type: string
        document_reason:
          description: Document reason extracted from the document.
          nullable: true
          type: string
        document_recipient_information:
          $ref: '#/components/schemas/TemporaryVehicleRegistrationDocumentExtraction_document_recipient_information'
