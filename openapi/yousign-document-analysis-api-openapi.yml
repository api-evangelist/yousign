      - $ref: '#/components/schemas/DocumentAnalysisMeta_1'
      - properties:
          type:
            enum:
            - social_security
            type: string
          extracted_from_document:
            $ref: '#/components/schemas/SocialSecurityExtraction'
          checks:
            $ref: '#/components/schemas/SocialSecurityCheck'
        type: object
      required:
      - checks
      - country_code
      - created_at
      - data_anonymized
      - extracted_from_document
      - id
      - previous_attempt_id
      - status
      - type
      - updated_at
      - workflow_session_id
      - workspace_id
      title: Social Security
      type: object
    InitiateSocialSecurity:
      additionalProperties: false
      properties:
        file:
          description: 'The file containing the data to extract.

            Accepted formats: PDF, PNG, JPG, JPEG.

            Max size: 25 MB.

            Max number of pages per PDF: 10.

            '
          example: Binary file
          format: binary
          type: string
        type:
          description: Type of document you want to analyze. Will be used to match the detected document type.
          enum:
          - social_security
          example: social_security
          type: string
        workspace_id:
          description: 'Scopes the Document Analysis to a specific workspace.

            Defaults to the default workspace if not specified.

            '
          example: 9a93d3b5-fb3b-4abf-9e70-26315b33506c
          format: uuid
          nullable: true
          type: string
        workflow_session_id:
          $ref: '#/components/schemas/WorkflowSessionId'
        previous_attempt_id:
          $ref: '#/components/schemas/PreviousAttemptId'
        analysis_type:
          $ref: '#/components/schemas/AnalysisTypeMultipart'
        checks:
          $ref: '#/components/schemas/InitiateSocialSecurity_checks'
      required:
      - file
      - type
      title: Initiate Social Security
      type: object
    DocumentAnalysisCheck:
      additionalProperties: false
      description: Represents the result of checking if an extracted value matches an expected value with different levels of match (exact, close, or no match).
      example:
        extracted: John Doe
        expected: John Doe
        match_level: exact
      properties:
        extracted:
          description: The extracted value from the document.
          nullable: true
          type: string
        expected:
          description: The expected value for the check.
          type: string
        match_level:
          $ref: '#/components/schemas/DocumentAnalysisMatchLevel'
      required:
      - expected
      - extracted
      - match_level
      title: Document Analysis Check
      type: object
