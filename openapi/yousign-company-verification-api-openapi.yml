            company_number: null
            legal_form:
              code: null
              description: null
            vat_number: null
            activities: []
            founded_on: null
            ceased_on: null
            active: null
            commercial_registration:
              location: null
              registered_on: null
            has_workforce: null
          headquarter:
            address_line_1: null
            address_line_2: null
            postal_code: null
            city: null
            country_code: null
          legal_representatives: []
  securitySchemes:
