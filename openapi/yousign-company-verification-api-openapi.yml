    post:
      description: 'Initiate a new Company Verification by providing the company number or by uploading a document containing company information.


        Related guide: [Company Registry Verification](https://developers.yousign.com/docs/company-verification).


        **ℹ️ This endpoint accepts two request body formats — pick the one that matches your use case:**

        - 📝 `application/json` — provide the company number directly, or reference an existing Workflow Session Applicant by ID.

        - 📁 `multipart/form-data` — upload a binary file containing the company information.


        **🔓 Endpoint access**

        - Environments: `production`, `sandbox`

        - API key scopes: `organization`, `workspace`

        - Plans: `pro`, `scale`

        - Add-ons (for production access): `Verify - Company registry verification`

        '
      operationId: post-verifications-companies
      requestBody:
        content:
          application/json:
            examples:
              france:
                summary: French company verification
                value:
                  company_number: '794513986'
                  country_code: FR
                  workspace_id: 9a93d3b5-fb3b-4abf-9e70-26315b33506c
              spain:
                summary: Spanish company verification
                value:
                  company_number: B12345678
                  country_code: ES
                  workspace_id: 9a93d3b5-fb3b-4abf-9e70-26315b33506c
              luxembourg:
                summary: Luxembourg company verification
                value:
                  company_number: B1234567
                  country_code: LU
                  workspace_id: 9a93d3b5-fb3b-4abf-9e70-26315b33506c
              italy:
                summary: Italian company verification
                value:
                  company_number: '12345678901'
                  country_code: IT
                  workspace_id: 9a93d3b5-fb3b-4abf-9e70-26315b33506c
              germany:
                summary: German company verification
                value:
                  company_number: HRB123456
                  country_code: DE
                  company_name: Test Company GmbH
                  zip_code: '10115'
                  street: Unter den Linden 1
                  city: Berlin
                  register_court: Amtsgericht Berlin (Charlottenburg)
                  workspace_id: 9a93d3b5-fb3b-4abf-9e70-26315b33506c
              with_applicant:
                summary: Verification linked to an existing Workflow Session Applicant
                value:
                  applicant_id: 9a93d3b5-fb3b-4abf-9e70-26315b33506c
            schema:
              $ref: '#/components/schemas/post_verifications_companies_request'
          multipart/form-data:
            example:
              file: Binary file
              country_code: FR
              workspace_id: 9a93d3b5-fb3b-4abf-9e70-26315b33506c
            schema:
              $ref: '#/components/schemas/InitiateCompanyFromFile'
