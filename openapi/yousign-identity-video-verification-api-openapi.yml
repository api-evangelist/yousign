    PreviousAttemptId:
      description: 'ID of the previous attempt within the same `workflow_session_id`.

        Allows continuity between multiple attempts of the same Action.

        Null if this is the first attempt.

        '
      example: 9412b83b-b4b9-4a94-97b5-2b43dfa4cde4
      format: uuid
      nullable: true
      title: Previous Attempt identifier
      type: string
    InitiateIdentityVideo:
      additionalProperties: false
      properties:
        first_name:
          allOf:
          - $ref: '#/components/schemas/HumanName'
          description: The first name provided must match exactly as it appears on the ID document, as a consistency check will be performed. If multiple given names are listed on the document, you must provide only one of them.
          example: John
          maxLength: 255
          minLength: 1
          type: string
        last_name:
          allOf:
          - $ref: '#/components/schemas/HumanName'
          description: The last name provided must match exactly as it appears on the ID document, as a consistency check will be performed. If both a birth name and a usage name are listed on the document, you must provide one of them, but not both.
          example: Doe
          maxLength: 255
          minLength: 1
          type: string
        redirection_url:
          description: The URL to redirect the person back to your application or website after the identity verification flow is complete.
          example: https://example.com/
          format: uri
          maxLength: 2000
          minLength: 1
          type: string
        face_recognition:
          default: false
          description: Enable face recognition step in the identity verification flow.
          example: false
          type: boolean
        pvid:
          default: false
          description: Enable PVID mode in the identity verification flow.
          example: false
          type: boolean
        workspace_id:
          description: 'Scopes the verification to a specific workspace.

            Defaults to the default workspace if not specified.

            '
          example: 9412b83b-b4b9-4a94-97b5-2b43dfa4cde3
          format: uuid
          nullable: true
          type: string
        workflow_session_id:
          $ref: '#/components/schemas/WorkflowSessionId'
        previous_attempt_id:
          $ref: '#/components/schemas/PreviousAttemptId'
        min_age:
          description: Minimum age required for the document holder.
          example: 18
          minimum: 1
          nullable: true
          type: integer
        max_age:
          description: Maximum age allowed for the document holder.
          example: 65
          minimum: 1
          nullable: true
          type: integer
        prohibited_countries:
          description: List of prohibited issuing countries (ISO 3166-1 alpha-2).
          example:
          - RU
          - KP
          items:
            pattern: ^[A-Z]{2}$
            type: string
          minItems: 1
          nullable: true
          type: array
        pre_selected_residence_country_code:
          description: Pre-fill the residence country in the verification flow (ISO 3166-1 alpha-2, uppercase).
          example: FR
          format: ISO 3166-1 alpha-2
          nullable: true
          pattern: ^[A-Z]{2}$
          type: string
        pre_selected_document_issuing_country_code:
          description: Pre-fill the document issuing country in the verification flow (ISO 3166-1 alpha-2, uppercase).
          example: FR
          format: ISO 3166-1 alpha-2
          nullable: true
          pattern: ^[A-Z]{2}$
          type: string
        pre_selected_document_type:
          description: Pre-fill the document type in the verification flow.
          enum:
          - id_card
          - passport
          - residence_permit
          - driver_license
          - travel_document
          example: id_card
          nullable: true
          type: string
        pre_selected_locale:
          description: Pre-fill the UI language of the verification flow (ISO 639-1, lowercase 2-letter code).
          example: fr
          format: ISO 639-1
          nullable: true
          pattern: ^[a-z]{2}$
          type: string
      required:
      - first_name
      - last_name
      - redirection_url
      title: Initiate Identity Video Verification
      type: object
    WorkflowSessionId:
      description: 'Unique identifier of a Workflow Session. When provided, an Action is created in the Workflow Session, and this resource is associated with that Action.

        '
      example: 0ef334d2-7f36-4643-8a2a-4283b4a3e4a4
      format: uuid
      nullable: true
      title: Workflow Session identifier
      type: string
    Pagination:
      description: Metadata about the response.
      properties:
        next_cursor:
          description: 'Token to get the next page of results. If `null`, there are no more pages.

            '
          minLength: 1
          nullable: true
          type: string
      required:
      - next_cursor
      type: object
