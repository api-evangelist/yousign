      - workspace_id
      title: IdentityVideoMeta
      type: object
    IdentityVideoDocument:
      additionalProperties: false
      description: Includes all information that has been extracted from the document, as well as the best images of the document.
      nullable: true
      properties:
        full_name:
          description: Full name of the document holder as it appears on the identity document
          example: David Vincent
          maxLength: 510
          nullable: true
          type: string
        born_on:
          description: Date of birth on the document
          example: '2024-01-18'
          format: date
          nullable: true
          type: string
        type:
          description: Type of document.
          enum:
          - null
          - driver_license
          - id_card
          - passport
          - residence_permit
          - travel_document
          nullable: true
          type: string
        issuing_country_code:
          example: US
          format: ISO 3166-1 alpha-2
          nullable: true
          pattern: ^[A-Z]{2}$
          type: string
        national_identification_number:
          description: 'Some documents may contain a national identification number.

            For example, Italian ID cards contain the Codice Fiscale on the back of the document.

            When this data is available on the document, it will be returned here, otherwise it will be NULL.

            Consult our [guide](https://developers.yousign.com/docs/video-based-identity-verification) for more details and examples.

            '
          example: MLLSNT82P65Z404U
          nullable: true
          type: string
      required:
      - born_on
      - full_name
      - issuing_country_code
      - national_identification_number
      - type
      title: IdentityVideoDocument
      type: object
