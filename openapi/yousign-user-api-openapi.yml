components:
  schemas:
    CreateUser:
      properties:
        email:
          description: 'The email address must not match any existing User''s email.

            '
          example: john.doe@example.com
          format: email
          title: User's email address
          type: string
        role:
          description: 'Role assigned to the User in the Organization.

            '
          enum:
          - admin
          - member
          title: User's role
          type: string
        locale:
          $ref: '#/components/schemas/Locale'
        workspaces:
          description: 'The new User must be associated with at least one Workspace in the Organization.

            '
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 1
          title: User's Workspace
          type: array
          uniqueItems: true
        first_name:
          allOf:
          - $ref: '#/components/schemas/HumanName'
          description: User's first name
          example: John
          maxLength: 255
          minLength: 1
          title: First name
          type:
          - string
          - 'null'
        last_name:
          allOf:
          - $ref: '#/components/schemas/HumanName'
          description: User's last name
          example: Doe
          maxLength: 255
          minLength: 1
          title: Last name
          type:
          - string
          - 'null'
        phone_number:
          description: E.164 format
          example: '+41446667700'
          minLength: 1
          title: User's phone number
          type:
          - string
          - 'null'
        job_title:
          description: This property is a [Safe String](https://developers.yousign.com/reference/oas-specification#safe-string).
          example: Employee
          format: safe-string
          maxLength: 255
          minLength: 1
          title: User's job title
          type:
          - string
          - 'null'
      required:
