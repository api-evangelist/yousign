paths:
  /signature_requests:
    get:
      description: Returns the list of all Signatures Requests in your organization. You can limit the number of items returned by using filters and pagination. Consult our guide for more details and examples.
      operationId: get-signature_requests
      parameters:
      - description: After cursor (pagination)
        in: query
        name: after
        required: false
        schema:
          minLength: 1
          type: string
      - description: The limit of items count to retrieve.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 100
          minimum: 1
          type: integer
      - description: 'Filter by `status`. Allowed operators: `eq`, `in`.

          Example: `status[in]=draft,done`

          '
        example:
          eq:
          - draft
          in:
          - draft
          - done
        explode: true
        in: query
        name: status
        required: false
        schema:
          description: Filter by status.
          minProperties: 1
          type: object
        style: deepObject
      - description: 'Filter by `created_at`. Allowed operators: `eq`, `between`, `before`, `after`.

          Format: the date format required is `yyyy-mm-dd`

          Example: `created_at[between]=2025-03-02,2025-03-04`

          '
        example:
          between:
          - '2025-03-02'
          - '2025-03-04'
          before:
          - '2025-03-02'
        explode: true
        in: query
        name: created_at
        required: false
        schema:
          description: Filter by date of creation.
          minProperties: 1
          type: object
        style: deepObject
      - description: 'Filter by `activated_at`. Allowed operators: `eq`, `between`, `before`, `after`.

          Format: the date format required is `yyyy-mm-dd`

          Example: `activated_at[after]=2025-03-01`

          '
        example:
          after:
          - '2025-03-01'
        explode: true
        in: query
        name: activated_at
        required: false
        schema:
          description: Filter by activation date.
          minProperties: 1
          type: object
        style: deepObject
      - description: 'Filter by `completed_at`. Allowed operators: `eq`, `between`, `before`, `after`.

          Format: the date format required is `yyyy-mm-dd`

          Example: `completed_at[between]=2025-03-01,2025-03-31`

          '
        example:
          between:
          - '2025-03-01'
          - '2025-03-31'
        explode: true
        in: query
        name: completed_at
        required: false
        schema:
          description: Filter by completion date.
          minProperties: 1
          type: object
        style: deepObject
      - description: 'Filter by `approved_at`. Allowed operators: `eq`, `between`, `before`, `after`.

          Format: the date format required is `yyyy-mm-dd`

          Example: `approved_at[after]=2025-03-01`

          '
        example:
          after:
          - '2025-03-01'
        explode: true
        in: query
        name: approved_at
        required: false
        schema:
          description: Filter by approval date.
          minProperties: 1
          type: object
        style: deepObject
      - description: 'Filter by `rejected_at`. Allowed operators: `eq`, `between`, `before`, `after`.

          Format: the date format required is `yyyy-mm-dd`

          Example: `rejected_at[before]=2025-04-01`

