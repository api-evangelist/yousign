          minProperties: 1
          type: object
        style: deepObject
      - description: 'Filter by `source`. Allowed operators: `eq`, `in`.

          Default value: `source[eq]=public_api`. If not specified, only Signature Requests created via the Public API are returned.

          Example: `source[in]=public_api,app`

