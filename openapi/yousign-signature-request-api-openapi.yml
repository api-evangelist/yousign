        example:
          eq:
          - To Sign
          in:
          - To Sign
          - Miscellaneous
        explode: true
        in: query
        name: label.name
        required: false
        schema:
          description: Case sensitive filter by Label's name.
          minProperties: 1
          type: object
        style: deepObject
