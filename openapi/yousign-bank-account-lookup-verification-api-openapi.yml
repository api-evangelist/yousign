    post:
      description: 'Initiate a new Bank Account Lookup Verification to check if a bank account exists and belongs to the specified person or company.


        Related guide: [Bank Account Verification](https://developers.yousign.com/docs/bank-account-lookup-verification)


        **ℹ️ This endpoint accepts two request body formats — pick the one that matches your use case:**

        - 📝 `application/json` — provide the natural person''s bank account details directly, or reference an existing Workflow Session Applicant by ID.

        - 📁 `multipart/form-data` — upload a binary file containing the natural person''s bank account details.


        **🔓 Endpoint access**

        - Environments: `production`, `sandbox`

        - API key scopes: `organization`, `workspace`

        - Plans: `pro`, `scale`

        - Add-ons (for production access): `Verify - Bank account verification`

        '
      operationId: post-verifications-bank_account_lookups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/post_verifications_bank_account_lookups_request'
