components:
  headers:
    rateLimit-remaining:
      description: The number of requests remaining in the current rate limit window
      schema:
        type: integer
    rateLimit-reset:
      description: The remaining time until the rate limit resets in seconds
      schema:
        type: integer
    rateLimit-remaining-hour:
      description: The number of requests remaining in the current hour rate limit window
      schema:
        type: integer
    rateLimit-limit:
      description: The maximum number of requests that the consumer is permitted to make in a given period
      schema:
        type: integer
    retry-after:
      description: Retry the request after X seconds
      schema:
        type: integer
    rateLimit-remaining-minute:
      description: The number of requests remaining in the current minute rate limit window
      schema:
        type: integer
    rateLimit-limit-minute:
      description: The maximum number of requests that the consumer is permitted to make in an minute window
      schema:
        type: integer
    rateLimit-limit-hour:
      description: The maximum number of requests that the consumer is permitted to make in an hour window
      schema:
        type: integer
  schemas:
    New_Approver_From_Scratch:
      description: Create a new Approver from scratch.
      properties:
        info:
          $ref: '#/components/schemas/New_Approver_From_Scratch_info'
      required:
      - info
      title: New Approver From Scratch
      type: object
    InternalServerError:
      properties:
        type:
          example: about:blank
          type: string
        detail:
          example: Something wrong occurred.
          type: string
      required:
      - detail
      - type
      title: InternalServerError
      type: object
    New_Approver_From_Existing_Signer:
      description: Create a new Approver from an existing Signer.
      properties:
        signer_id:
          example: 8b6ed2f3-244f-487a-baa1-bbe4f51c8744
          format: uuid
          type: string
      required:
      - signer_id
      title: New Approver From Existing Signer
      type: object
    CreateApprover:
      oneOf:
      - $ref: '#/components/schemas/New_Approver_From_Scratch'
      - $ref: '#/components/schemas/New_Approver_From_Existing_User'
      - $ref: '#/components/schemas/New_Approver_From_Existing_Contact'
      - $ref: '#/components/schemas/New_Approver_From_Existing_Signer'
      properties:
        custom_text:
          $ref: '#/components/schemas/CustomText'
        insert_after_id:
          description: 'ID of the recipient this one must follow in an ordered flow; they will only be asked to act after that recipient.

            When `custom_recipient_order` is enabled, this can reference any approver or signer.

            When `custom_recipient_order` is disabled, the referenced ID must be an approver. `ordered_approvers` must be enabled on the Signature Request.

            '
          example: 8b6ed2f3-244f-487a-baa1-bbe4f51c8744
          format: uuid
          nullable: true
          type: string
        group_with_id:
          description: 'ID of another recipient (Approver or Signer); both will be allowed to act in parallel in an ordered flow.

            Only available when `custom_recipient_order` is enabled.

            '
          example: 8b6ed2f3-244f-487a-baa1-bbe4f51c8744
          format: uuid
          nullable: true
          type: string
        excluded_documents:
          $ref: '#/components/schemas/ExcludedDocuments'
      type: object
    TooManyRequestsResponse:
      properties:
        message:
          type: string
      required:
      - message
      title: TooManyRequestsResponse
      type: object
    Approver:
      description: Approver
      properties:
        id:
          example: 8b6ed2f3-244f-487a-baa1-bbe4f51c8744
          format: uuid
          minLength: 1
          type: string
        status:
          enum:
          - initiated
          - notified
          - approved
          - rejected
          type: string
        info:
          $ref: '#/components/schemas/Approver_info'
        approval_link:
          format: uri
          minLength: 1
          nullable: true
          type: string
        approval_link_expiration_date:
          example: '2024-01-18T22:59:00Z'
          format: date-time
          nullable: true
          type: string
        custom_text:
          $ref: '#/components/schemas/CustomText'
        approved_at:
          example: '2024-01-18T22:59:00Z'
          format: date-time
          nullable: true
          type: string
        recipient_stage_index:
          description: Position of the recipient in the signing flow. Recipients with the same index are notified simultaneously.
          type: integer
        excluded_documents:
          description: 'List of Document IDs not visible to this Approver.

            '
          items:
            format: uuid
            type: string
          type: array
      required:
      - approved_at
      - custom_text
      - excluded_documents
      - id
      - info
      - recipient_stage_index
      - status
      title: Approver
      type: object
    ExcludedDocuments:
      description: 'List of Document IDs not visible to this Recipient. When omitted, the Recipient can see all Documents. Only available when the document_visibility feature is enabled on the organization.

        '
      example:
      - 89120884-d29a-4b1a-ac7b-a9e73a872796
      - 7c0c2d1e-3f4a-5b6c-8d9e-0f1a2b3c4d5e
      items:
        format: uuid
        type: string
      type: array
    UnsupportedMediaTypeResponse:
      properties:
        type:
          type: string
        detail:
          type: string
      required:
      - detail
      - type
      title: UnsupportedMediaTypeResponse
      type: object
    New_Approver_From_Existing_User:
      description: Create a new Approver from an existing User.
      properties:
        user_id:
          example: 8b6ed2f3-244f-487a-baa1-bbe4f51c8744
          format: uuid
          type: string
      required:
      - user_id
      title: New Approver From Existing User
      type: object
    New_Approver_From_Scratch_info:
      properties:
        first_name:
          maxLength: 255
          minLength: 1
          type: string
        last_name:
          maxLength: 255
          minLength: 1
          type: string
        email:
          maxLength: 100
          minLength: 1
          type: string
        phone_number:
          description: E.164 format.
          example: '+41446667700'
          minLength: 1
          nullable: true
          type: string
        locale:
          $ref: '#/components/schemas/Locale'
      required:
      - email
      - first_name
      - last_name
      - locale
      type: object
    UpdateApprover:
      properties:
        info:
          $ref: '#/components/schemas/UpdateApprover_info'
        custom_text:
          $ref: '#/components/schemas/CustomText'
        insert_after_id:
          description: 'ID of the recipient this one must follow in an ordered flow; they will only be asked to act after that recipient.

            When `custom_recipient_order` is enabled, this can reference any approver or signer.

            When `custom_recipient_order` is disabled, the referenced ID must be an approver. `ordered_approvers` must be enabled on the Signature Request.

            '
          example: 8b6ed2f3-244f-487a-baa1-bbe4f51c8744
          format: uuid
          nullable: true
          type: string
        group_with_id:
          description: 'ID of another recipient (Approver or Signer); both will be allowed to act in parallel in an ordered flow.

            Only available when `custom_recipient_order` is enabled.

            '
          example: 8b6ed2f3-244f-487a-baa1-bbe4f51c8744
          format: uuid
          nullable: true
          type: string
        excluded_documents:
          $ref: '#/components/schemas/ExcludedDocuments'
      type: object
    MethodNotAllowed:
      properties:
        message:
          type: string
      required:
      - message
      title: MethodNotAllowed
      type: object
    Locale:
      description: Locale settings used for communication.
      enum:
      - en
      - fr
      - de
      - it
      - nl
      - es
      - pl
      minLength: 1
      title: Locale
      type: string
    NotFoundResponse:
      properties:
        type:
          type: string
        detail:
          type: string
      required:
      - detail
      - type
      title: NotFoundResponse
      type: object
    BadRequestResponse:
      properties:
        type:
          type: string
        detail:
          type: string
      required:
      - detail
      - type
      title: BadRequestResponse
      type: object
    ForbiddenResponse:
      properties:
        type:
          type: string
        detail:
          type: string
      required:
      - detail
      - type
      title: ForbiddenResponse
      type: object
    UnauthorizedResponse:
      properties:
        type:
          type: string
        detail:
          type: string
      required:
      - detail
      - type
      title: UnauthorizedResponse
      type: object
    UUID:
      description: The unique identifier for a resource.
      example: 9a93d3b5-fb3b-4abf-9e70-26315b33506c
      format: uuid
      type: string
    UpdateApprover_info:
      nullable: true
      properties:
        first_name:
          maxLength: 255
          minLength: 1
          type: string
        last_name:
          maxLength: 255
          minLength: 1
          type: string
        email:
          format: email
          maxLength: 100
          minLength: 1
          type: string
        phone_number:
          description: E.164 format
          example: '+41446667700'
          minLength: 1
          nullable: true
          type: string
        locale:
          $ref: '#/components/schemas/Locale'
      type: object
    New_Approver_From_Existing_Contact:
      description: Create a new Approver from an existing Contact.
      properties:
        contact_id:
          example: 8b6ed2f3-244f-487a-baa1-bbe4f51c8744
          format: uuid
          type: string
      required:
