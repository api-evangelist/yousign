    New_Signer_From_Existing_User:
      description: Create a new signer from an existing user
      properties:
        user_id:
          description: Create signer from an existing user
          example: 9a93d3b5-fb3b-4abf-9e70-26315b33506c
          format: uuid
          type: string
        fields:
          items:
            $ref: '#/components/schemas/FieldsInput'
          type: array
        insert_after_id:
          description: 'ID of the recipient this one must follow in an ordered flow; they will only be asked to act after that recipient.

            When `custom_recipient_order` is enabled, this can reference any approver or signer.

            When `custom_recipient_order` is disabled, the referenced ID must be a signer. `ordered_signers` must be enabled on the Signature Request.

            '
          example: 9a93d3b5-fb3b-4abf-9e70-26315b33506c
          format: uuid
          nullable: true
          type: string
        group_with_id:
          description: 'ID of another recipient (Approver or Signer); both will be allowed to act in parallel in an ordered flow.

            Only available when `custom_recipient_order` is enabled.

            '
          example: 9a93d3b5-fb3b-4abf-9e70-26315b33506c
          format: uuid
          nullable: true
          type: string
